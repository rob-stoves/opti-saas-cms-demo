query getProductsByRoot(
    $loc: [Locales]
    $limit: Int! = 100
    $skip: Int! = 0
    $rootUrl: String
    $status: String! = "Published"
    $site: String
) {
    # Optimizely Graph caps `limit` at 100 — callers paginate with `skip`.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        skip: $skip
        where: {
            _metadata: {
                status: { eq: $status }
                url: { base: { eq: $site }, default: { startsWith: $rootUrl } }
                types: { notEq: "FolderPage" }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
