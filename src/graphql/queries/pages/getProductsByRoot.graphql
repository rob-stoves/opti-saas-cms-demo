query getProductsByRoot(
    $loc: [Locales]
    $limit: Int! = 200
    $rootUrl: String
    $status: String! = "Published"
    $site: String
) {
    # See getProducts.graphql. Query the base _Page collection filtered to the
    # ProductPage type, the current site origin (url.base), and the chosen root
    # (url.default startsWith). Aliased to `ProductPage` so component code is
    # unchanged.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        where: {
            _metadata: {
                status: { eq: $status }
                types: { eq: "ProductPage" }
                url: { base: { eq: $site }, default: { startsWith: $rootUrl } }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
