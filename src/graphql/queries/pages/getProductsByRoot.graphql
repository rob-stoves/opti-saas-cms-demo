query getProductsByRoot(
    $loc: [Locales]
    $limit: Int! = 500
    $rootUrl: String
    $status: String! = "Published"
    $site: String
) {
    # See getProducts.graphql. Scope to the chosen root via url.default startsWith
    # plus url.base; select ProductPage fields via the fragment. Non-products are
    # dropped in the component.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        where: {
            _metadata: {
                status: { eq: $status }
                url: { base: { eq: $site }, default: { startsWith: $rootUrl } }
                types: { notEq: "FolderPage" }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
