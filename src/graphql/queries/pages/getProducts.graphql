query getProducts(
    $loc: [Locales]
    $limit: Int! = 500
    $skip: Int! = 0
    $status: String! = "Published"
    $site: String
) {
    # The public Graph index does not match `types: { eq: "ProductPage" }` for
    # this newly-created type, even though items resolve as ProductPage for field
    # selection (pageById + inline fragments work). Query the base _Page
    # collection the way the sitemap does (url.base + types notEq FolderPage),
    # select ProductPage fields via the fragment, and drop non-products in code.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        skip: $skip
        where: {
            _metadata: {
                status: { eq: $status }
                url: { base: { eq: $site } }
                types: { notEq: "FolderPage" }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
