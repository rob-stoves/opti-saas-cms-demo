query getProducts(
    $loc: [Locales]
    $limit: Int! = 100
    $skip: Int! = 0
    $status: String! = "Published"
    $site: String
) {
    # Optimizely Graph caps `limit` at 100 — callers paginate with `skip`.
    # Query _Page filtered to products (the ProductPage collection isn't reliably
    # populated for this new type) and alias to `ProductPage`.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        skip: $skip
        where: {
            _metadata: {
                status: { eq: $status }
                url: { base: { eq: $site } }
                types: { notEq: "FolderPage" }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
