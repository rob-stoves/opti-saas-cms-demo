query getProducts(
    $loc: [Locales]
    $limit: Int! = 400
    $skip: Int! = 0
    $status: String! = "Published"
    $site: String
) {
    # Query the base _Page collection filtered to the ProductPage type and alias
    # it back to `ProductPage`. Also filter by url.base = current site origin —
    # this is how every working collection query in this repo (sitemap, faceted
    # search, ArticleList) reaches content on the public Graph endpoint.
    ProductPage: _Page(
        locale: $loc
        orderBy: { _metadata: { displayName: ASC } }
        limit: $limit
        skip: $skip
        where: {
            _metadata: {
                status: { eq: $status }
                types: { eq: "ProductPage" }
                url: { base: { eq: $site } }
            }
        }
    ) {
        total
        items {
            ...ProductPageExcerpt
        }
    }
}
